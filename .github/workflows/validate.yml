name: Validate skills

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Generated files must be committed
        run: |
          git add -A -- setup.md setup-staging.md mcp-connect.md mcp-connect-staging.md \
            borrower-onboard.md human-direct-flow.md spend-and-pay.md x402-credit-pay.md \
            authorize-agent.md repay.md idempotency.md agent-session.md llms-full.txt .well-known/agent-skills/index.json
          git diff --cached --exit-code -- \
            setup.md setup-staging.md mcp-connect.md mcp-connect-staging.md \
            borrower-onboard.md human-direct-flow.md spend-and-pay.md x402-credit-pay.md \
            authorize-agent.md repay.md idempotency.md agent-session.md llms-full.txt .well-known/agent-skills/index.json \
            || { echo "FAIL: generated files drifted — run npm run build and commit"; exit 1; }
      - name: Merge gate — pinned signer advertises the keygen contract
        env:
          # @sohopay/agent-signer is a PRIVATE package published from the sibling sohopay/sohopay-agent-signer
          # repo, so this repo's GITHUB_TOKEN cannot read it and the fail-closed contract gate can never resolve
          # the signer. Provide a read:packages PAT as the AGENT_SIGNER_READ_TOKEN secret; the `||` falls back to
          # GITHUB_TOKEN when the secret is unset, leaving behaviour unchanged until it is configured.
          NODE_AUTH_TOKEN: ${{ secrets.AGENT_SIGNER_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/signer-contract-check.mjs
      - name: SP6 eval runner (replay gate)
        run: |
          node --test evals/runner/*.test.mjs evals/runner/adapters/*.test.mjs
          node evals/runner/run.mjs --adapter replay --suite all
      # m2: always(), so a red replay step (e.g. goldens not yet recorded) still shows every INV result.
      - name: Skill invariants (INV-*)
        if: always()
        run: npm run validate
