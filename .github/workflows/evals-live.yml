# SP6 live behavioural evals: OPT-IN, advisory, never a merge gate (the gate is the replay step in validate.yml).
#
# Runs the pinned Claude Code CLI against the localhost mock world:
#   node evals/runner/run.mjs --adapter claude-code --suite all --samples 5 --require-audit
# The adapter pins the model (claude-sonnet-5-5) and --max-turns 20 (evals/runner/adapters/cc-guards.mjs PINS); spend
# comes from each session's own reported cost, and the run stops with partial results once the cap is crossed.
#
# Job graph: gate (no env, no secrets, refuses forks) -> live (protected environment, contents: read)
#            -> issues (issues: write) and regen (contents: write, same-repo PRs only).
#
# Safety rules (spec "Live path"; T17 rulings):
#   * never `pull_request_target`: PR code must never run with the base repo's secrets on a fork's say-so;
#   * the fork refusal runs in the first job, before any job that loads the protected environment;
#   * ANTHROPIC_API_KEY lives only in the protected environment, attached only to the live job, exposed only to the
#     single step that starts the live run;
#   * pushes go only to the PR's own head branch, never develop/main, with GITHUB_TOKEN (no personal token).
name: SP6 live evals (opt-in)

on:
  workflow_dispatch:
    inputs:
      case:
        description: "One case id for a smoke run (empty = every case)"
        required: false
        default: ""
      samples:
        description: "Samples per case (5 = the live k; fewer = smoke run, never regenerates goldens)"
        required: false
        default: "5"
  # labeled ONLY: every live run spends once, on an explicit label (or a dispatch). Pushes never re-run it; to re-run,
  # remove and re-add run-live-evals, or dispatch.
  pull_request:
    types: [labeled]

permissions: {}

# One live run per PR (or ref); a newer run cancels the older one. A PR event that will not run (the label is absent, or
# some OTHER label was added) gets a unique suffix, so it can never cancel a live run that is in progress.
concurrency:
  group: sp6-live-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && (!contains(github.event.pull_request.labels.*.name, 'run-live-evals') || (github.event.action == 'labeled' && github.event.label.name != 'run-live-evals')) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (fork refusal, no secrets)
    # PR runs only while the run-live-evals label is on the PR; adding some other label does not start a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'run-live-evals') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-live-evals'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allow_regen: ${{ steps.check.outputs.allow_regen }}
      case: ${{ steps.check.outputs.case }}
      samples: ${{ steps.check.outputs.samples }}
    steps:
      - name: Refuse a fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::error::refusing a fork PR (${HEAD_REPO}): live evals run only on same-repo branches"
          exit 1
      # Its own step, with no outputs: the branch name (attacker-settable text) never shares a step with GITHUB_OUTPUT.
      - name: Refuse a protected head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            develop|main) echo "::error::refusing a PR whose head branch is $HEAD_REF"; exit 1 ;;
          esac
      - name: Validate the request
        id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          IN_CASE: ${{ inputs.case }}
          IN_SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Belt and braces with the step above: a fork never gets past this job.
            [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::refusing a fork PR ($HEAD_REPO)"; exit 1; }
            { echo "allow_regen=true"; echo "case="; echo "samples=5"; } >> "$GITHUB_OUTPUT"
          else
            [[ "$IN_CASE" =~ ^([a-z0-9][a-z0-9-]{0,80})?$ ]] || { echo "::error::invalid case id"; exit 1; }
            [[ "$IN_SAMPLES" =~ ^[1-9][0-9]?$ ]] && [ "$IN_SAMPLES" -le 20 ] || { echo "::error::samples must be 1..20"; exit 1; }
            # Dispatch runs have no PR head branch to commit to: they never regenerate goldens.
            { echo "allow_regen=false"; echo "case=$IN_CASE"; echo "samples=$IN_SAMPLES"; } >> "$GITHUB_OUTPUT"
          fi

  live:
    name: Live run (protected environment)
    needs: gate
    runs-on: ubuntu-latest
    # Above the live step's own limit (M2), so a slow run is stopped by its step timeout and the verdict, egress scan
    # and uploads still run within the job.
    timeout-minutes: 340
    environment: sp6-live-evals
    permissions:
      contents: read
    # Downstream jobs act only on a verdict that passed the egress scan (C1); regen also needs a clean golden scan (I1).
    outputs:
      safety_failures: ${{ steps.egress.outcome == 'success' && steps.verdict.outputs.safety_failures || 'false' }}
      regen_count: ${{ steps.egress.outcome == 'success' && steps.goldenscan.outcome == 'success' && steps.verdict.outputs.regen_count || '0' }}
      golden_scan_rejects: ${{ steps.egress.outcome == 'success' && steps.goldenscan.outputs.rejects || '0' }}
    env:
      # Kernel-enforcement and child-evidence tests must RUN here (none skipped); see the test step below.
      SP6_REQUIRE_SANDBOX: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_VERSION: "2.1.292" # == PINS.CLI_VERSION (evals-live-workflow.test.mjs checks)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR head itself (not the merge ref), so regenerated goldens hash the skills on the branch they land on.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the OS sandbox and tracer (bubblewrap, strace, unprivileged userns)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap strace
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The same functional probe sandboxSupport() runs (R4-2): fail here, loudly, rather than in a sample.
          bwrap --die-with-parent --new-session --unshare-all --ro-bind / / --dev /dev --proc /proc true
          strace -V | head -n 1

      - name: Install the pinned Claude Code CLI
        run: |
          set -euo pipefail
          npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          got="$(claude --version | awk '{print $1}')"
          [ "$got" = "$CLAUDE_CODE_VERSION" ] || { echo "::error::claude --version is $got, pinned $CLAUDE_CODE_VERSION"; exit 1; }

      - name: Runner tests with the sandbox REQUIRED (kernel + evidence tests must run and pass)
        # No ANTHROPIC_API_KEY here, and the adapter tests refuse any `claude` that is not a marked stub (R4-1), so the
        # real CLI installed above can never be started by a test. SP6_AUDIT is NOT set: the stub tests need it unset.
        env:
          SP6_RUN_ROOT_BASE: ${{ runner.temp }}/sp6-run-tests
        run: |
          set -euo pipefail
          # I1: force the spec reporter — Node 22 prints TAP (`# skipped N`) when stdout is a pipe.
          node --test --test-reporter=spec evals/runner/*.test.mjs evals/runner/adapters/*.test.mjs | tee "$RUNNER_TEMP/sp6-tests.txt"
          grep -qx 'ℹ skipped 0' "$RUNNER_TEMP/sp6-tests.txt" || { echo "::error::a runner test was skipped under SP6_REQUIRE_SANDBOX=1"; exit 1; }

      - name: Live run (k samples per case, budget-capped)
        id: run
        timeout-minutes: 300
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SP6_AUDIT: require
          # Runner-private, outside /tmp and outside the checkout; assertHermetic denies it to the agent. Do not set
          # TMPDIR: the hermetic check requires the platform default.
          SP6_RUN_ROOT_BASE: ${{ runner.temp }}/sp6-run
          SP6_LIVE_OUT_DIR: ${{ runner.temp }}/sp6-live/transcripts
          SP6_LIVE_BUDGET_USD: "10" # provisional cap (spec); recalibrate from the first measured runs
          CASE: ${{ needs.gate.outputs.case }}
          SAMPLES: ${{ needs.gate.outputs.samples }}
        run: |
          set -uo pipefail
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY is not set in the sp6-live-evals environment"; exit 1; }
          mkdir -p "$SP6_LIVE_OUT_DIR"
          # --live: the only switch that lets the adapter spawn the real CLI (M4). The key reaches the CLI through an
          # apiKeyHelper reading a 0600 file in the agent-denied run root, never through the agent's env (C1).
          args=(--adapter claude-code --live --suite all --samples "$SAMPLES" --require-audit)
          if [ -n "$CASE" ]; then args+=(--case "$CASE"); fi
          node evals/runner/run.mjs "${args[@]}" > "$RUNNER_TEMP/sp6-live/report.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = all passed, 1 = a report with failures; anything else means there is no report to act on.
          if [ "$code" -gt 1 ]; then echo "::error::run.mjs produced no report (exit $code)"; exit "$code"; fi
          jq -r '"Live: \(.total) samples, \(.passed) passed, \(.failed) failed, \(.hardErrors) adapter errors; spend $\([.cases[].costUsd // 0] | add // 0)"' \
            "$RUNNER_TEMP/sp6-live/report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict (regression issues, golden candidates)
        id: verdict
        # always(): a run stopped by its timeout or cancelled still gets whatever verdict its report allows (M2).
        if: ${{ always() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The PR NUMBER, not its branch name: this step writes GITHUB_OUTPUT, so it holds no attacker-settable text.
          REF: "${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALLOW_REGEN: ${{ needs.gate.outputs.allow_regen }}
          CASE: ${{ needs.gate.outputs.case }}
          SAMPLES: ${{ needs.gate.outputs.samples }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/sp6-live/report.json" ]; then
            echo "::warning::no live report (the run was stopped or failed before reporting): no verdict; transcripts saved so far are still uploaded"
            exit 0
          fi
          flags=()
          # Regenerate only from a full k=5, all-case run on a same-repo PR (gate decided allow_regen).
          if [ "$ALLOW_REGEN" = "true" ] && [ "$SAMPLES" = "5" ] && [ -z "$CASE" ]; then flags+=(--allow-regen); fi
          node evals/runner/live-ci.mjs --report "$RUNNER_TEMP/sp6-live/report.json" --live-dir "$RUNNER_TEMP/sp6-live/transcripts" \
            --out "$RUNNER_TEMP/sp6-verdict" --samples "$SAMPLES" "${flags[@]}" | tee -a "$GITHUB_OUTPUT"

      # I1: every staged golden must pass the merge gate's committed-secrets scan (committed-secrets.test.mjs) BEFORE it
      # can be committed. live-ci.mjs already refuses failing candidates (and writes a golden-scan-<case> issue); this is
      # the independent re-check of the exact staged bytes. A hit quarantines the whole regen set (nothing is committed)
      # and writes the issue; the regen job runs only when this step succeeded.
      - name: Committed-secrets scan of the staged goldens (before any commit)
        id: goldenscan
        if: ${{ always() && steps.verdict.outcome == 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: "${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/sp6-verdict" ]; then echo "rejects=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node evals/runner/live-ci.mjs --scan-verdict-dir "$RUNNER_TEMP/sp6-verdict" | tee -a "$GITHUB_OUTPUT"

      # C1 egress: nothing leaves this job unless it is free of the real key. The adapter already quarantines any
      # sample whose capture holds a harness secret (in any never_appears encoding); this is the independent last
      # check over everything about to be uploaded (transcripts, report, issue bodies, golden candidates). A hit
      # deletes the directories (quarantine) and fails: no upload, no issue, no regen.
      - name: Egress scan (real API key) before any upload
        id: egress
        if: ${{ always() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          dirs=()
          for d in "$RUNNER_TEMP/sp6-live" "$RUNNER_TEMP/sp6-verdict"; do [ -e "$d" ] && dirs+=("$d"); done
          [ "${#dirs[@]}" -gt 0 ] || { echo "nothing to scan"; exit 0; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "no key in this job: nothing it could leak"; exit 0; }
          b64="$(printf %s "$ANTHROPIC_API_KEY" | base64 -w0)"
          grep -rqF -e "$ANTHROPIC_API_KEY" -e "$b64" -e "${b64%%=*}" "${dirs[@]}"
          rc=$?
          if [ "$rc" -eq 1 ]; then echo "egress scan clean"; exit 0; fi
          rm -rf "${dirs[@]}"
          echo "::error::egress scan: the real API key (or its base64) was found in the live output (grep rc=$rc); quarantined — nothing is uploaded"
          exit 1

      # Transcripts carry only the mock world's FAKE-SP6-CANARY-* values: the agent never holds a real credential
      # (allowlisted env, key via apiKeyHelper), and the scan above refuses any that slipped through. Short retention.
      - name: Upload transcripts and report
        if: ${{ always() && steps.egress.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sp6-live-transcripts-${{ github.run_id }}
          path: ${{ runner.temp }}/sp6-live
          retention-days: 7
          if-no-files-found: warn
      - name: Upload verdict
        if: ${{ always() && steps.egress.outcome == 'success' && steps.verdict.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sp6-live-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/sp6-verdict
          retention-days: 3
          if-no-files-found: warn

      - name: Fail the job when any sample failed (advisory, never a merge gate)
        if: ${{ steps.run.outputs.exit_code != '0' }}
        run: |
          echo "::error::live evals: at least one sample failed or was not run (see the report artifact)"
          exit 1

  # One issue per failing safety case id, plus one per golden candidate refused by the committed-secrets scan (I1).
  issues:
    name: Open / update sp6-live-regression issues
    needs: [gate, live]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.live.outputs.safety_failures == 'true' || needs.live.outputs.golden_scan_rejects != '0') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sp6-live-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/verdict
      - name: One issue per failing safety case id (findings + run link only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ runner.temp }}/verdict
        # M3: per-id error handling — one gh failure never stops the other case ids; the step fails at the end.
        run: |
          set -uo pipefail
          gh label create sp6-live-regression --force --color B60205 --description "SP6 live eval: a safety case failed in a live sample" \
            || echo "::warning::could not create/update the sp6-live-regression label"
          failed=0
          shopt -s nullglob
          for f in "$VERDICT"/issues/*.md; do
            id="$(basename "$f" .md)"
            if ! [[ "$id" =~ ^[a-z0-9][a-z0-9-]{0,80}$ ]]; then echo "::error::unexpected case id in verdict: $id"; failed=$((failed + 1)); continue; fi
            title="sp6-live-regression: $id"
            if ! num="$(gh issue list --label sp6-live-regression --state open --limit 200 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"; then
              echo "::error::$id: could not list issues"; failed=$((failed + 1)); continue
            fi
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file "$f" || { echo "::error::$id: comment on #$num failed"; failed=$((failed + 1)); }
            else
              gh issue create --title "$title" --label sp6-live-regression --body-file "$f" || { echo "::error::$id: create failed"; failed=$((failed + 1)); }
            fi
          done
          exit "$(( failed > 0 ))"

  regen:
    name: Commit regenerated goldens onto the PR head branch
    needs: [gate, live]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.gate.outputs.allow_regen == 'true' &&
          needs.live.outputs.regen_count != '' && needs.live.outputs.regen_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse protected branches
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            develop|main) echo "::error::never commit goldens to $HEAD_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sp6-live-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/verdict
      # No PR code runs in this job (only git): the candidates were audited, secrets-scanned and replayed green in the live job.
      - name: Commit and push (GITHUB_TOKEN, bot author, no trailer)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ runner.temp }}/verdict
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::warning::the PR head moved since the live run ($HEAD_SHA); goldens not committed — re-run live evals on the new head"
            exit 0
          fi
          paths=()
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            [[ "$p" =~ ^evals/sohopay-(onboard|x402)/transcripts/[a-z0-9][a-z0-9-]*\.json$ ]] || { echo "::error::unexpected golden path: $p"; exit 1; }
            cp "$VERDICT/regen/$p" "$p"
            paths+=("$p")
          done < "$VERDICT/regen-manifest.txt"
          [ "${#paths[@]}" -gt 0 ] || { echo "no goldens to commit"; exit 0; }
          # The pending list only shrinks: drop each recorded case in the same commit as its golden (INV-sp6-goldens-pending).
          pending=evals/goldens-pending.json
          if [ -s "$pending" ]; then
            for p in "${paths[@]}"; do
              suite="$(cut -d/ -f2 <<<"$p")"; id="$(basename "$p" .json)"
              jq --arg s "$suite" --arg id "$id" 'if .pending[$s] then .pending[$s] |= map(select(. != $id)) else . end' "$pending" > "$RUNNER_TEMP/pending.json"
              mv "$RUNNER_TEMP/pending.json" "$pending"
            done
            paths+=("$pending")
          fi
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then echo "goldens unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "test(evals): regenerate SP6 goldens from a k=5 live run" -m "Sample 0 of each case whose 5 live samples all passed: ${RUN_URL}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          msg="Goldens committed to ${HEAD_REF}. GITHUB_TOKEN pushes do not re-trigger workflows: a maintainer must re-run the replay gate (Validate skills) on this PR. Upgrade path: a GitHub App installation token, whose pushes do re-trigger CI (spec, Live path, Regeneration)."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
